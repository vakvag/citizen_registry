name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

# Δίνουμε ρητά τα δικαιώματα για να δημιουργηθεί το Release
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build and Test (Unit & Integration)
      working-directory: ./citizen-registry
      run: mvn clean verify
      
    - name: Upload Unit Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-test-reports
        path: '**/target/surefire-reports/'
        if-no-files-found: ignore
        
    - name: Upload Integration Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: failsafe-test-reports
        path: '**/target/failsafe-reports/'
        if-no-files-found: ignore

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build Executable
      working-directory: ./citizen-registry
      run: mvn clean package -DskipTests
      
    - name: Create Early Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "citizen-registry/citizen-service/target/*.jar"
        tag: "dev-${{ github.sha }}"
        name: "Development Release ${{ github.sha }}"
        draft: false
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
