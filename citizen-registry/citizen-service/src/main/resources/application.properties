# ===========================================

spring.application.name=citizen-registry

# ---- Database Configuration (Environment configurable with H2 default) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:citizendb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ---- JPA / Hibernate Configuration ----
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true

# ---- H2 Console (για debugging) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
